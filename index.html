<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Class Tracker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; }
.app { max-width: 1020px; margin: 0 auto; padding: 2rem 1.5rem; }
.top-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 1.5rem; }
h1 { font-size: 24px; font-weight: 600; }
.subtitle { font-size: 14px; color: #888; margin-top: 4px; }
.sync-pill { font-size: 12px; font-family: monospace; color: #888; background: #fff; border: 1px solid #e8e8e8; border-radius: 20px; padding: 4px 12px; white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
.stat { background: #fff; border-radius: 10px; padding: 16px 18px; border: 1px solid #e8e8e8; }
.stat-label { font-size: 12px; color: #888; margin-bottom: 5px; }
.stat-value { font-size: 22px; font-weight: 600; }
.card { background: #fff; border-radius: 12px; border: 1px solid #e8e8e8; padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 1rem; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: #888; }
.field input, .field select { height: 36px; padding: 0 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fff; color: #1a1a1a; outline: none; }
.field input:focus, .field select:focus { border-color: #1a1a1a; }
.btn { height: 36px; padding: 0 16px; border-radius: 8px; font-size: 14px; cursor: pointer; background: #1a1a1a; color: #fff; border: none; font-weight: 500; white-space: nowrap; }
.btn:hover { background: #333; }
.btn-ghost { background: transparent; color: #1a1a1a; border: 1px solid #ddd; }
.btn-ghost:hover { background: #f5f5f3; }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn-danger { background: #fdeaea; color: #a32d2d; border: none; }
.btn-danger:hover { background: #f9d0d0; }
.class-row { border: 1px solid #e8e8e8; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
.class-summary { display: grid; grid-template-columns: 2fr 1.6fr 1.1fr 1.1fr 1.1fr 1.1fr auto auto; gap: 8px; align-items: center; padding: 13px 16px; cursor: pointer; background: #fff; transition: background 0.15s; }
.class-summary:hover { background: #fafafa; }
.col-label { font-size: 11px; color: #aaa; margin-bottom: 2px; }
.col-val { font-size: 14px; }
.col-val.strong { font-weight: 600; }
.badge { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; }
.badge-done { background: #e8f5e0; color: #3a6e11; }
.badge-owing { background: #fdeaea; color: #a32d2d; }
.badge-ongoing { background: #e6f1fb; color: #185fa5; }
.progress-bar { height: 4px; background: #eee; border-radius: 4px; overflow: hidden; margin-top: 5px; }
.progress-fill { height: 100%; border-radius: 4px; background: #1D9E75; }
.expand-btn { font-size: 18px; color: #bbb; background: none; border: none; cursor: pointer; padding: 0 4px; line-height: 1; transition: transform 0.2s; user-select: none; }
.expand-btn.open { transform: rotate(180deg); }
.class-detail { display: none; border-top: 1px solid #f0f0f0; background: #fafafa; padding: 16px; }
.class-detail.open { display: block; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.detail-section { background: #fff; border: 1px solid #e8e8e8; border-radius: 9px; padding: 13px 15px; }
.detail-section h3 { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 10px; }
.log-list { list-style: none; max-height: 220px; overflow-y: auto; margin-bottom: 10px; }
.log-item { display: flex; flex-direction: column; font-size: 13px; padding: 8px 0; border-bottom: 1px solid #f5f5f3; gap: 5px; }
.log-item:last-child { border-bottom: none; }
.log-item-row { display: flex; align-items: center; gap: 8px; }
.log-date { color: #555; min-width: 90px; font-size: 12px; }
.log-method { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #e6f1fb; color: #185fa5; font-weight: 500; white-space: nowrap; }
.log-amount { font-weight: 600; color: #1a1a1a; flex: 1; text-align: right; }
.log-note { color: #555; font-size: 12px; }
.log-teacher-note { color: #185fa5; font-size: 12px; font-style: italic; }
.log-del { background: none; border: none; cursor: pointer; color: #ccc; font-size: 12px; padding: 2px 5px; border-radius: 3px; margin-left: auto; flex-shrink: 0; }
.log-del:hover { color: #a32d2d; background: #fdeaea; }

/* attachments */
.attachments-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.attach-thumb { position: relative; width: 56px; height: 56px; border-radius: 6px; overflow: hidden; border: 1px solid #e8e8e8; background: #f5f5f3; cursor: pointer; flex-shrink: 0; }
.attach-thumb img { width: 100%; height: 100%; object-fit: cover; }
.attach-file { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; text-decoration: none; }
.attach-file-icon { font-size: 20px; }
.attach-file-name { font-size: 9px; color: #888; text-align: center; padding: 0 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
.attach-del { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: rgba(0,0,0,0.5); color: #fff; border: none; cursor: pointer; font-size: 9px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s; }
.attach-thumb:hover .attach-del { opacity: 1; }

/* upload area */
.upload-area { border: 1.5px dashed #ddd; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #aaa; cursor: pointer; text-align: center; transition: all .15s; margin-top: 6px; }
.upload-area:hover, .upload-area.dragover { border-color: #1a1a1a; color: #1a1a1a; background: #f9f9f7; }
.upload-area input[type=file] { display: none; }
.uploading-bar { height: 3px; background: #e8e8e8; border-radius: 2px; overflow: hidden; margin-top: 4px; display: none; }
.uploading-bar.active { display: block; }
.uploading-fill { height: 100%; background: #1D9E75; border-radius: 2px; animation: uploading 1s ease-in-out infinite alternate; }
@keyframes uploading { from { width: 20%; } to { width: 90%; } }

.mini-form { display: flex; gap: 7px; flex-wrap: wrap; align-items: flex-end; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f0f0f0; }
.mini-field { display: flex; flex-direction: column; gap: 3px; }
.mini-field label { font-size: 11px; color: #aaa; }
.mini-field input, .mini-field select { height: 30px; padding: 0 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: #fff; color: #1a1a1a; outline: none; }
.mini-field input:focus, .mini-field select:focus { border-color: #1a1a1a; }
.empty-log { font-size: 13px; color: #bbb; text-align: center; padding: 14px 0; }
.header-row { display: grid; grid-template-columns: 2fr 1.6fr 1.1fr 1.1fr 1.1fr 1.1fr auto auto; gap: 8px; padding: 4px 16px 6px; }
.header-row span { font-size: 11px; font-weight: 600; color: #bbb; text-transform: uppercase; letter-spacing: 0.04em; }
.empty-state { text-align: center; color: #aaa; padding: 2rem; font-size: 14px; }

/* lightbox */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 8px; object-fit: contain; }
.lightbox-close { position: fixed; top: 18px; right: 22px; color: #fff; font-size: 28px; cursor: pointer; background: none; border: none; line-height: 1; }

.loading-overlay { position: fixed; inset: 0; background: rgba(245,245,243,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 999; font-size: 15px; color: #888; }
.spinner { width: 32px; height: 32px; border: 3px solid #e8e8e8; border-top-color: #1a1a1a; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 720px) {
  .stats { grid-template-columns: repeat(2,1fr); }
  .class-summary { grid-template-columns: 1fr 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
  .header-row { display: none; }
}
</style>
</head>
<body>

<div id="loading-overlay" class="loading-overlay">
  <div class="spinner"></div>
  <span>Loading your classes…</span>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&#x2715;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="app">
  <div class="top-bar">
    <div>
      <h1>My class tracker</h1>
      <p class="subtitle">Track classes, attendance, payments and balance</p>
    </div>
    <span class="sync-pill" id="sync-status">Connecting…</span>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Classes enrolled</div><div class="stat-value" id="st-classes">0</div></div>
    <div class="stat"><div class="stat-label">Sessions attended</div><div class="stat-value" id="st-attended">0</div></div>
    <div class="stat"><div class="stat-label">Total paid</div><div class="stat-value" id="st-paid">₫0</div></div>
    <div class="stat"><div class="stat-label">Total remaining</div><div class="stat-value" id="st-remaining">₫0</div></div>
  </div>

  <div class="card">
    <div class="card-title">Add a class</div>
    <div class="form-row">
      <div class="field"><label>Class name</label><input id="f-name" placeholder="e.g. English B2" style="min-width:145px;"></div>
      <div class="field"><label>Teacher / Center</label><input id="f-teacher" placeholder="e.g. Ms. Linh" style="min-width:130px;"></div>
      <div class="field"><label>Total sessions</label><input id="f-total" type="number" min="1" value="20" style="min-width:90px;"></div>
      <div class="field"><label>Fee / session (₫)</label><input id="f-fee" type="number" value="200000" style="min-width:110px;"></div>
      <button class="btn" onclick="addClass()">Add class</button>
    </div>
  </div>

  <div id="classes-wrap">
    <div class="header-row">
      <span>Class</span><span>Attendance</span><span>Total fee</span>
      <span>Paid</span><span>Remaining</span><span>Status</span><span></span><span></span>
    </div>
    <div class="empty-state" id="empty-msg">No classes yet. Add your first class above.</div>
    <div id="class-list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://oxjsdbhidbidjnbbszkq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bUf4sT27KfqO3Ch1Y9eLqQ_4iG_LRvi';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABLE = 'class_tracker';
const BUCKET = 'class-attachments';

/* ── sync status ── */
function setSyncStatus(state) {
  const el = document.getElementById('sync-status');
  const map = { ok:'Synced ✓', saving:'Saving…', error:'Sync error!', uploading:'Uploading…' };
  const col = { ok:'#3a6e11', saving:'#b07d0a', error:'#a32d2d', uploading:'#185fa5' };
  el.textContent = map[state] || state;
  el.style.color = col[state] || '#888';
}

/* ── helpers ── */
let classes = [];
function fmt(n) { return '₫' + Math.round(n).toLocaleString('vi-VN'); }
function today() { return new Date().toISOString().slice(0,10); }
function totalPaid(c) { return (c.payments||[]).reduce((s,p)=>s+p.amount,0); }
function attendedCount(c) { return (c.attendances||[]).length; }

function getStatus(c) {
  const paid = totalPaid(c), fee = c.total * c.fee;
  if (attendedCount(c) >= c.total) return 'done';
  if (paid >= fee) return 'ongoing';
  return 'owing';
}
function statusBadge(s) {
  if (s==='done') return '<span class="badge badge-done">Completed</span>';
  if (s==='ongoing') return '<span class="badge badge-ongoing">Ongoing</span>';
  return '<span class="badge badge-owing">Balance due</span>';
}

function isImage(url) { return /\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?|$)/i.test(url); }

function fileIcon(name) {
  const ext = (name||'').split('.').pop().toLowerCase();
  if (['pdf'].includes(ext)) return '📄';
  if (['doc','docx'].includes(ext)) return '📝';
  if (['xls','xlsx'].includes(ext)) return '📊';
  if (['ppt','pptx'].includes(ext)) return '📑';
  if (['zip','rar'].includes(ext)) return '🗜️';
  return '📎';
}

/* ── lightbox ── */
function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

/* ── file upload to Supabase Storage ── */
async function uploadFile(file, context) {
  const ext = file.name.split('.').pop();
  const path = `${context}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  setSyncStatus('uploading');
  const { data, error } = await db.storage.from(BUCKET).upload(path, file, { cacheControl: '3600', upsert: false });
  if (error) { setSyncStatus('error'); console.error(error); return null; }
  const { data: urlData } = db.storage.from(BUCKET).getPublicUrl(path);
  setSyncStatus('ok');
  return { url: urlData.publicUrl, name: file.name, path };
}

async function deleteAttachment(path) {
  await db.storage.from(BUCKET).remove([path]);
}

/* ── DB helpers ── */
async function loadFromDB() {
  try {
    const { data, error } = await db.from(TABLE).select('*').order('created_at');
    if (error) throw error;
    classes = data.map(r => ({ ...r.data, _dbid: r.id }));
    setSyncStatus('ok');
    return true;
  } catch(e) { console.error(e); setSyncStatus('error'); return false; }
}

async function saveClass(c) {
  setSyncStatus('saving');
  try {
    const { _dbid, ...data } = c;
    if (_dbid) {
      await db.from(TABLE).update({ data }).eq('id', _dbid);
    } else {
      const { data: rows } = await db.from(TABLE).insert({ data }).select();
      if (rows && rows[0]) c._dbid = rows[0].id;
    }
    setSyncStatus('ok');
  } catch(e) { console.error(e); setSyncStatus('error'); }
}

async function deleteFromDB(c) {
  if (!c._dbid) return;
  await db.from(TABLE).delete().eq('id', c._dbid);
}

function findByDbid(dbid) { return classes.find(c => c._dbid === dbid); }

/* ── render attachments ── */
function renderAttachments(items, onDelete) {
  if (!items || !items.length) return '';
  return `<div class="attachments-row">${items.map((att, i) => {
    if (isImage(att.url)) {
      return `<div class="attach-thumb" onclick="openLightbox('${att.url}')">
        <img src="${att.url}" alt="${att.name}" loading="lazy">
        <button class="attach-del" onclick="event.stopPropagation();${onDelete}(${i})" title="Remove">✕</button>
      </div>`;
    } else {
      return `<div class="attach-thumb">
        <a class="attach-file" href="${att.url}" target="_blank" rel="noopener" title="${att.name}">
          <span class="attach-file-icon">${fileIcon(att.name)}</span>
          <span class="attach-file-name">${att.name}</span>
        </a>
        <button class="attach-del" onclick="event.stopPropagation();${onDelete}(${i})" title="Remove">✕</button>
      </div>`;
    }
  }).join('')}</div>`;
}

/* ── render ── */
function updateStats() {
  document.getElementById('st-classes').textContent = classes.length;
  document.getElementById('st-attended').textContent = classes.reduce((s,c)=>s+attendedCount(c),0);
  document.getElementById('st-paid').textContent = fmt(classes.reduce((s,c)=>s+totalPaid(c),0));
  document.getElementById('st-remaining').textContent = fmt(classes.reduce((s,c)=>s+Math.max(0,c.total-attendedCount(c))*c.fee,0));
}

function render() {
  const list = document.getElementById('class-list');
  document.getElementById('empty-msg').style.display = classes.length ? 'none' : 'block';

  list.innerHTML = classes.map(c => {
    const fee = c.total * c.fee;
    const paid = totalPaid(c);
    const attended = attendedCount(c);
    const remaining = Math.max(0, c.total - attended) * c.fee;
    const pct = Math.min(100, c.total ? Math.round((attended/c.total)*100) : 0);
    const status = getStatus(c);
    const did = c._dbid;

    const attendLog = (c.attendances||[]).length
      ? [...(c.attendances||[])].reverse().map((a,ri) => {
          const realIdx = c.attendances.length - 1 - ri;
          const atts = renderAttachments(a.attachments, `removeAttachFromAttendance.bind(null,'${did}',${realIdx})`);
          return `<li class="log-item">
            <div class="log-item-row">
              <span class="log-date">${a.date}</span>
              <span class="log-note">${a.note||''}</span>
              <button class="log-del" onclick="removeAttendance('${did}',${realIdx})">✕</button>
            </div>
            ${a.teacherNote ? `<div class="log-teacher-note">📝 ${a.teacherNote}</div>` : ''}
            ${atts}
          </li>`;
        }).join('')
      : '<li class="empty-log">No sessions logged yet</li>';

    const payLog = (c.payments||[]).length
      ? [...(c.payments||[])].reverse().map((p,ri) => {
          const realIdx = c.payments.length - 1 - ri;
          const atts = renderAttachments(p.attachments, `removeAttachFromPayment.bind(null,'${did}',${realIdx})`);
          return `<li class="log-item">
            <div class="log-item-row">
              <span class="log-date">${p.date}</span>
              <span class="log-method">${p.method}</span>
              <span class="log-amount">${fmt(p.amount)}</span>
              <button class="log-del" onclick="removePayment('${did}',${realIdx})">✕</button>
            </div>
            ${atts}
          </li>`;
        }).join('')
      : '<li class="empty-log">No payments logged yet</li>';

    return `
    <div class="class-row" id="row-${did}">
      <div class="class-summary" onclick="toggleDetail('${did}')">
        <div>
          <div class="col-val strong">${c.name}</div>
          <div style="font-size:12px;color:#aaa;margin-top:2px;">${c.teacher}</div>
        </div>
        <div>
          <div class="col-val">${attended} / ${c.total} sessions</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
        <div><div class="col-label">Total fee</div><div class="col-val">${fmt(fee)}</div></div>
        <div><div class="col-label">Paid</div><div class="col-val" style="color:#3a6e11;font-weight:600;">${fmt(paid)}</div></div>
        <div><div class="col-label">Remaining</div><div class="col-val" style="color:${remaining>0?'#a32d2d':'#3a6e11'};font-weight:600;">${fmt(remaining)}</div></div>
        <div>${statusBadge(status)}</div>
        <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteClass('${did}')">Remove</button>
        <button class="expand-btn" id="expand-${did}" onclick="event.stopPropagation();toggleDetail('${did}')">▾</button>
      </div>

      <div class="class-detail" id="detail-${did}">
        <div class="detail-grid">

          <div class="detail-section">
            <h3>Attendance log</h3>
            <ul class="log-list">${attendLog}</ul>
            <div class="mini-form">
              <div class="mini-field"><label>Date attended</label><input type="date" id="ad-date-${did}" value="${today()}" style="min-width:120px;"></div>
              <div class="mini-field"><label>Your note</label><input type="text" id="ad-note-${did}" placeholder="e.g. Chapter 5" style="min-width:110px;"></div>
              <div class="mini-field"><label>Teacher's note</label><input type="text" id="ad-tnote-${did}" placeholder="e.g. Need to review..." style="min-width:140px;"></div>
              <button class="btn btn-sm" style="margin-top:auto;" onclick="addAttendance('${did}')">Log session</button>
            </div>
            <div class="upload-area" id="ua-attend-${did}"
              onclick="document.getElementById('uf-attend-${did}').click()"
              ondragover="event.preventDefault();this.classList.add('dragover')"
              ondragleave="this.classList.remove('dragover')"
              ondrop="handleDrop(event,'attend','${did}')">
              📎 Click or drag to attach files / photos to this session
              <input type="file" id="uf-attend-${did}" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip"
                onchange="handleFileInput(event,'attend','${did}')">
            </div>
            <div class="uploading-bar" id="ub-attend-${did}"><div class="uploading-fill"></div></div>
          </div>

          <div class="detail-section">
            <h3>Payment history</h3>
            <ul class="log-list">${payLog}</ul>
            <div class="mini-form">
              <div class="mini-field"><label>Date paid</label><input type="date" id="pay-date-${did}" value="${today()}" style="min-width:120px;"></div>
              <div class="mini-field"><label>Amount (₫)</label><input type="number" id="pay-amt-${did}" placeholder="e.g. 1000000" style="min-width:110px;"></div>
              <div class="mini-field"><label>Method</label>
                <select id="pay-method-${did}" style="min-width:110px;">
                  <option>Bank transfer</option><option>Cash</option><option>MoMo</option>
                  <option>ZaloPay</option><option>VNPay</option><option>Other</option>
                </select>
              </div>
              <button class="btn btn-sm" style="margin-top:auto;" onclick="addPayment('${did}')">Add payment</button>
            </div>
            <div class="upload-area" id="ua-pay-${did}"
              onclick="document.getElementById('uf-pay-${did}').click()"
              ondragover="event.preventDefault();this.classList.add('dragover')"
              ondragleave="this.classList.remove('dragover')"
              ondrop="handleDrop(event,'pay','${did}')">
              📎 Click or drag to attach receipt / payment proof
              <input type="file" id="uf-pay-${did}" multiple accept="image/*,.pdf,.doc,.docx"
                onchange="handleFileInput(event,'pay','${did}')">
            </div>
            <div class="uploading-bar" id="ub-pay-${did}"><div class="uploading-fill"></div></div>
          </div>

        </div>
      </div>
    </div>`;
  }).join('');
  updateStats();
}

function toggleDetail(did) {
  const detail = document.getElementById('detail-' + did);
  const btn = document.getElementById('expand-' + did);
  detail.classList.toggle('open');
  btn.classList.toggle('open');
}
function keepOpen(did) {
  document.getElementById('detail-' + did)?.classList.add('open');
  document.getElementById('expand-' + did)?.classList.add('open');
}

/* ── file handling ── */
function showUploadBar(type, did, show) {
  const bar = document.getElementById(`ub-${type}-${did}`);
  if (bar) bar.classList.toggle('active', show);
}

async function handleFileInput(event, type, did) {
  const files = Array.from(event.target.files);
  event.target.value = '';
  await attachFiles(files, type, did);
}

async function handleDrop(event, type, did) {
  event.preventDefault();
  document.getElementById(`ua-${type}-${did}`)?.classList.remove('dragover');
  const files = Array.from(event.dataTransfer.files);
  await attachFiles(files, type, did);
}

async function attachFiles(files, type, did) {
  if (!files.length) return;
  const c = findByDbid(did); if (!c) return;
  showUploadBar(type, did, true);

  const uploaded = [];
  for (const file of files) {
    const att = await uploadFile(file, `${did}/${type}`);
    if (att) uploaded.push(att);
  }
  showUploadBar(type, did, false);
  if (!uploaded.length) return;

  if (type === 'attend') {
    // Attach to the most recent attendance entry, or create a pending queue
    if (!c._pendingAttachments) c._pendingAttachments = {};
    if (!c._pendingAttachments.attend) c._pendingAttachments.attend = [];
    c._pendingAttachments.attend.push(...uploaded);
  } else {
    if (!c._pendingAttachments) c._pendingAttachments = {};
    if (!c._pendingAttachments.pay) c._pendingAttachments.pay = [];
    c._pendingAttachments.pay.push(...uploaded);
  }
  await saveClass(c);
  render(); keepOpen(did);
}

async function removeAttachFromAttendance(did, logIdx, attIdx) {
  const c = findByDbid(did); if (!c) return;
  const att = c.attendances[logIdx]?.attachments?.[attIdx];
  if (att?.path) await deleteAttachment(att.path);
  c.attendances[logIdx].attachments.splice(attIdx, 1);
  await saveClass(c);
  render(); keepOpen(did);
}

async function removeAttachFromPayment(did, logIdx, attIdx) {
  const c = findByDbid(did); if (!c) return;
  const att = c.payments[logIdx]?.attachments?.[attIdx];
  if (att?.path) await deleteAttachment(att.path);
  c.payments[logIdx].attachments.splice(attIdx, 1);
  await saveClass(c);
  render(); keepOpen(did);
}

/* ── class operations ── */
async function addClass() {
  const name = document.getElementById('f-name').value.trim();
  const teacher = document.getElementById('f-teacher').value.trim();
  const total = parseInt(document.getElementById('f-total').value) || 20;
  const fee = parseInt(document.getElementById('f-fee').value) || 0;
  if (!name) { document.getElementById('f-name').focus(); return; }
  const obj = { name, teacher: teacher||'—', total, fee, attendances: [], payments: [] };
  classes.push(obj);
  document.getElementById('f-name').value = '';
  document.getElementById('f-teacher').value = '';
  await saveClass(obj);
  render();
}

async function deleteClass(did) {
  if (!confirm('Remove this class and all its data?')) return;
  const c = findByDbid(did);
  classes = classes.filter(x => x._dbid !== did);
  render();
  if (c) await deleteFromDB(c);
}

async function addAttendance(did) {
  const c = findByDbid(did); if (!c) return;
  const date = document.getElementById('ad-date-' + did).value;
  const note = document.getElementById('ad-note-' + did).value.trim();
  const teacherNote = document.getElementById('ad-tnote-' + did).value.trim();
  if (!date) return;
  if (!c.attendances) c.attendances = [];
  // Pick up any pending attachments
  const attachments = c._pendingAttachments?.attend || [];
  if (c._pendingAttachments) delete c._pendingAttachments.attend;
  c.attendances.push({ date, note, teacherNote, attachments });
  c.attendances.sort((a,b) => a.date.localeCompare(b.date));
  document.getElementById('ad-note-' + did).value = '';
  document.getElementById('ad-tnote-' + did).value = '';
  await saveClass(c);
  render(); keepOpen(did);
}

async function removeAttendance(did, idx) {
  const c = findByDbid(did); if (!c) return;
  // Delete all attachments for this log entry
  for (const att of (c.attendances[idx]?.attachments || [])) {
    if (att.path) await deleteAttachment(att.path);
  }
  c.attendances.splice(idx, 1);
  await saveClass(c);
  render(); keepOpen(did);
}

async function addPayment(did) {
  const c = findByDbid(did); if (!c) return;
  const date = document.getElementById('pay-date-' + did).value;
  const amount = parseInt(document.getElementById('pay-amt-' + did).value) || 0;
  const method = document.getElementById('pay-method-' + did).value;
  if (!date || !amount) return;
  if (!c.payments) c.payments = [];
  const attachments = c._pendingAttachments?.pay || [];
  if (c._pendingAttachments) delete c._pendingAttachments.pay;
  c.payments.push({ date, amount, method, attachments });
  c.payments.sort((a,b) => a.date.localeCompare(b.date));
  document.getElementById('pay-amt-' + did).value = '';
  await saveClass(c);
  render(); keepOpen(did);
}

async function removePayment(did, idx) {
  const c = findByDbid(did); if (!c) return;
  for (const att of (c.payments[idx]?.attachments || [])) {
    if (att.path) await deleteAttachment(att.path);
  }
  c.payments.splice(idx, 1);
  await saveClass(c);
  render(); keepOpen(did);
}

/* ── boot ── */
(async () => {
  await loadFromDB();
  render();
  document.getElementById('loading-overlay').style.display = 'none';
})();
</script>
</body>
</html>
